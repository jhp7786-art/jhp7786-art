<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="100%" height="100%">
  <defs>
    <linearGradient id="ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#92FE9D;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Dark Background -->
  <rect width="200" height="100" rx="15" fill="#1e1e2e" />
  
  <!-- Collaborative Infinity/Node Symbol -->
  <path d="M 50 50 C 50 20, 90 20, 100 50 C 110 80, 150 80, 150 50 C 150 20, 110 20, 100 50 C 90 80, 50 80, 50 50 Z" 
        fill="none" stroke="url(#ai-grad)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- The Human & AI Nodes -->
  <circle cx="50" cy="50" r="6" fill="#00C9FF" />
  <circle cx="150" cy="50" r="6" fill="#92FE9D" />
  
  <!-- Partnership Text -->
  <text x="100" y="85" font-family="monospace" font-size="12" fill="#a6accd" text-anchor="middle" letter-spacing="2">H(AI²)</text>
</svg>
